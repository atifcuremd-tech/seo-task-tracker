const listItems=L=>(db[L]||[]).filter(g=>admin()||g.owner===role());
function renderList(L){let c=LISTS[L],[tn,tv,tf]=c.total,gs=listItems(L).slice().sort((a,b)=>(a.status==='Pending'?0:1)-(b.status==='Pending'?0:1)||String(b.date).localeCompare(String(a.date))),n=st=>gs.filter(g=>g.status===st).length,sum=st=>tf(gs.filter(g=>g.status===st).reduce((t,g)=>t+tv(g),0));
let rows=gs.map(g=>`<tr data-id="${g.id}">${c.cells(g)}<td>${esc(g.owner)}</td><td>${esc(g.date)}</td><td>${label(g.status)}</td><td>${esc(g.notes)}${g.feedback?'<div class="muted">Manager: '+esc(g.feedback)+'</div>':''}</td><td><div class="flex">${admin()&&g.status!=='Approved'?`<button class="btn small" onclick="reviewItem('${L}','${g.id}',true)">Approve</button>`:''}${admin()&&g.status!=='Rejected'?`<button class="btn secondary small" onclick="reviewItem('${L}','${g.id}',false)">Reject</button>`:''}${admin()||(g.owner===role()&&g.status==='Pending')?`<button class="btn danger small" onclick="deleteItem('${L}','${g.id}')">Delete</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="${c.head.length+5}">${c.empty}</td></tr>`;
return `<div class="kpis">${metric(n('Pending'),'Awaiting approval')}${metric(sum('Pending'),'Pending '+tn)}${metric(n('Approved'),'Approved')}${metric(sum('Approved'),'Approved '+tn)}</div><div class="card section"><h3>${c.add}</h3><form class="addform" onsubmit="addItem(event,'${L}')">${c.form}<button class="btn" type="submit">Submit for approval</button></form></div><div class="card section"><h3>${c.list} (${gs.length})</h3><div class="scroll"><table><thead><tr>${c.head.map(h=>`<th>${h}</th>`).join('')}<th>Added by</th><th>Date</th><th>Status</th><th>Notes</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
function addItem(e,L){e.preventDefault();let c=LISTS[L],o=c.prep(e.target.elements);if(typeof o==='string')return alert(o);db[L]=db[L]||[];let k=c.key(o),dup=db[L].find(g=>c.key(g)===k);if(dup&&!confirm(k+' is already in the list ('+dup.status+', added by '+dup.owner+'). Add it again?'))return;db[L].push({...o,id:uid(),owner:role(),date:today(),status:'Pending',feedback:''});save();render()}
function reviewItem(L,id,ok){if(!admin())return alert('Manager profile required.');let g=(db[L]||[]).find(x=>x.id===id);if(!g)return;let note=prompt(ok?'Approval note (optional):':'Reason for rejecting:');if(note===null)return;if(!ok&&!note.trim())return alert('A reason is required.');g.status=ok?'Approved':'Rejected';g.feedback=note.trim();g.reviewed=today();save();render()}
function deleteItem(L,id){let g=(db[L]||[]).find(x=>x.id===id);if(!g||!(admin()||(g.owner===role()&&g.status==='Pending')))return;if(confirm('Delete '+LISTS[L].key(g)+'?')){db[L]=db[L].filter(x=>x.id!==id);save();render()}}
let calOffset=0;
function renderCalendar(){let now=new Date(),cur=new Date(now.getFullYear(),now.getMonth()+calOffset,1),y=cur.getFullYear(),m=cur.getMonth(),first=cur.getDay(),count=new Date(y,m+1,0).getDate(),td=today();
let days=Array.from({length:first},()=>'<div></div>').concat(Array.from({length:count},(_,i)=>{let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<div class="day${d===td?' today':''}" onclick="openTask(null,'${d}')" title="Add a task due ${d}"><b>${i+1}</b><span class="dayadd">+</span>${visibleTasks().filter(t=>t.due===d).map(t=>`<span class="dot${t.status==='Completed'?' done':overdue(t)?' late':''}" title="${esc(t.name)}" onclick="event.stopPropagation();editTask('${t.id}')">${esc(String(t.name).slice(0,32))}</span>`).join('')}</div>`}));
return `<div class="card"><div class="flex between" style="margin-bottom:14px"><h3 style="margin:0">${cur.toLocaleString('en',{month:'long'})} ${y}</h3><div class="flex"><button class="btn secondary small" onclick="calDir=-1;calOffset--;render()">‹ Prev</button><button class="btn secondary small" onclick="calDir=calOffset>0?-1:1;calOffset=0;render()">Today</button><button class="btn secondary small" onclick="calDir=1;calOffset++;render()">Next ›</button></div></div><div class="calendar${calDir<0?' slideL':calDir>0?' slideR':''}">${(calDir=0,'')}${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<b class="muted">${x}</b>`).join('')}${days.join('')}</div></div>`}
function renderTeam(){let ed=admin();return `<div class="teamgrid">${USERS.map((u,i)=>{let t=(db.team||{})[u]||{};return `<div class="card teamcard"><div class="person-line" style="margin:0 0 16px"><span class="avatar${i%2?' av2':''}">${esc(u.split(' ').map(z=>z[0]).join(''))}</span><div class="person-info"><b>${esc(u)}</b><small>${esc(t.role||(i===0?'Manager':'Team member'))}</small></div></div>${ed?`<label class="field">Role<input data-k="role" value="${esc(t.role||'')}" maxlength="120"></label><label class="field">Rules and responsibilities<textarea data-k="rules" maxlength="3000">${esc(t.rules||'')}</textarea></label><label class="field">Success criteria<textarea data-k="criteria" maxlength="3000">${esc(t.criteria||'')}</textarea></label><button class="btn small" onclick="saveTeam(this,${i})">Save</button>`:`<h4>Rules and responsibilities</h4><p class="pre">${esc(t.rules||'Not defined yet.')}</p><h4>Success criteria</h4><p class="pre">${esc(t.criteria||'Not defined yet.')}</p>`}</div>`}).join('')}</div>`}
function saveTeam(btn,i){if(!admin())return;let o={};btn.closest('.teamcard').querySelectorAll('[data-k]').forEach(x=>o[x.dataset.k]=x.value.trim());db.team=db.team||{};db.team[USERS[i]]=o;save();btn.textContent='Saved ✓';setTimeout(render,700)}
function filterBar(){return `<div class="filters"><input id="fSearch" placeholder="Search tasks..." value="${esc(filters.search)}">${admin()?`<select id="fOwner"><option value="all">All employees</option>${USERS.map(x=>`<option ${filters.owner===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`:''}<select id="fStatus"><option value="all">All statuses</option>${['Not Started','In Progress','Under Review','Revision Requested','Completed','On Hold'].map(x=>`<option ${filters.status===x?'selected':''}>${x}</option>`).join('')}</select><select id="fCategory"><option value="all">All categories</option>${db.categories.map(x=>`<option ${filters.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><select id="fPriority"><option value="all">All priorities</option>${['Low','Medium','High','Critical'].map(x=>`<option ${filters.priority===x?'selected':''}>${x}</option>`).join('')}</select><label class="muted">From <input type="date" id="fFrom" value="${esc(filters.from)}"></label><label class="muted">To <input type="date" id="fTo" value="${esc(filters.to)}"></label><button class="btn secondary small" onclick="resetFilters()">Clear</button></div>`}
function taskTable(ts){return `<div class="scroll"><table><thead><tr><th>Task</th><th>Owner</th><th>Category</th><th>Due</th><th>Priority</th><th>Status</th><th>Progress</th><th>Actions</th></tr></thead><tbody>${ts.map(t=>`<tr data-id="${t.id}"><td><b>${esc(t.name)}</b> ${t.sample?'<span class="tag">SAMPLE</span>':''}<div class="muted">${esc(t.description).slice(0,110)}</div>${t.blocker?'<div class="muted">⚑ Blocker: '+esc(t.blocker)+'</div>':''}</td><td>${esc(t.owner)}</td><td>${esc(t.category)}</td><td>${esc(t.due||'—')} ${overdue(t)?label('Overdue'):''}</td><td>${label(t.priority)}</td><td>${label(t.status)}</td><td><div class="progress"><span style="width:${Math.max(0,Math.min(100,Number(t.progress)||0))}%"></span></div>${Number(t.progress)||0}%</td><td><div class="flex"><button class="btn secondary small" onclick="editTask('${t.id}')">Edit</button>${t.status!=='Completed'?`<button class="btn secondary small" onclick="submitReview('${t.id}')">Submit</button>`:''}${admin()&&t.status==='Under Review'?`<button class="btn small" onclick="reviewTask('${t.id}','approve')">Approve</button>`:''}<button class="btn danger small" onclick="deleteTask('${t.id}')">Delete</button></div></td></tr>`).join('')||'<tr><td colspan="8">No tasks match the current filters.</td></tr>'}</tbody></table></div>`}
function renderTasks(){return `<div class="card"><div class="flex between"><h3>All tasks (${selected().length})</h3><div class="flex"><button class="btn secondary small" onclick="exportCSV('tasks')">Export CSV</button><button class="btn small" onclick="openTask()">+ Add task</button></div></div>${filterBar()}${taskTable(selected().slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')))}</div>`}
function activityTable(as){return `<div class="scroll"><table><thead><tr><th>Date</th><th>Employee</th><th>Activity</th><th>Deliverable</th><th>Action</th></tr></thead><tbody>${as.map(a=>`<tr data-id="${a.id}"><td>${esc(a.date)} ${a.sample?'<span class="tag">SAMPLE</span>':''}</td><td>${esc(a.owner)}</td><td>${esc(a.description)}${a.blocker?'<div class="muted">Blocker: '+esc(a.blocker)+'</div>':''}</td><td>${link(a.url)}</td><td><button class="btn danger small" onclick="deleteActivity('${a.id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="5">No activity records.</td></tr>'}</tbody></table></div>`}
function renderActivities(){let as=visibleActivities().slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="card"><div class="flex between"><h3>Daily activity records (${as.length})</h3><div class="flex"><button class="btn secondary small" onclick="exportCSV('activities')">Export CSV</button><button class="btn small" onclick="openActivity()">+ Log activity</button></div></div><div class="flex"><input type="date" id="reportDate" value="${today()}"><button class="btn secondary" onclick="submitDaily()">Submit daily report</button></div><p class="muted">Submitted reports: ${db.reports.filter(r=>admin()||r.owner===role()).length}</p>${activityTable(as)}</div>`}
function renderReviews(){let ts=visibleTasks().filter(t=>['Under Review','Revision Requested'].includes(t.status));return `<div class="card"><h3>Review queue</h3>${ts.map(t=>`<div style="padding:15px 0;border-bottom:1px solid #e6ebf2"><b>${esc(t.name)}</b> ${t.sample?label('SAMPLE'):''} ${label(t.status)}<p class="muted">${esc(t.owner)} · ${esc(t.category)} · ${link(t.url)}</p>${t.feedback?`<p>Feedback: ${esc(t.feedback)}</p>`:''}${admin()?`<div class="flex"><button class="btn small" onclick="reviewTask('${t.id}','approve')">Approve</button><button class="btn secondary small" onclick="reviewTask('${t.id}','revise')">Request revisions</button><button class="btn danger small" onclick="reviewTask('${t.id}','reject')">Reject</button></div>`:'<span class="muted">Waiting for manager review.</span>'}</div>`).join('')||'<p class="muted">No tasks awaiting action.</p>'}</div><div class="card section"><h3>Review history</h3>${visibleTasks().flatMap(t=>(t.history||[]).map(h=>({task:t.name,...h}))).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,30).map(h=>`<p><b>${esc(h.action)}</b> · ${esc(h.task)}<br><span class="muted">${esc(h.at)} · ${esc(h.by)} · ${esc(h.note||'')}</span></p>`).join('')||'<p class="muted">No review history yet.</p>'}</div>`}
function renderPerformance(){let people=admin()?USERS.slice(1):[role()];return `<div class="two">${people.map(p=>{let ts=db.tasks.filter(t=>t.owner===p),as=db.activities.filter(a=>a.owner===p),done=ts.filter(t=>t.status==='Completed'),ontime=done.filter(t=>t.completed&&t.due&&t.completed<=t.due).length,quality=done.filter(t=>Number(t.quality)>0);let rate=done.length?Math.round(ontime/done.length*100):0;return `<div class="card"><h3>${esc(p)}</h3><div class="kpis" style="grid-template-columns:1fr 1fr">${metric(done.length,'Approved tasks')}${metric(ts.filter(t=>t.status==='In Progress').length,'In progress')}${metric(rate+'%','On-time delivery')}${metric(as.length,'Activities logged')}${metric(ts.filter(overdue).length,'Overdue')}${metric(ts.filter(t=>t.status==='Under Review').length,'Awaiting review')}${metric(ts.filter(t=>t.url).length,'Task deliverables')}${metric(quality.length?(quality.reduce((s,t)=>s+Number(t.quality),0)/quality.length).toFixed(1)+'/5':'—','Quality rating')}</div><h4>Completion by category</h4>${db.categories.filter(c=>ts.some(t=>t.category===c)).map(c=>{let n=ts.filter(t=>t.category===c),d=n.filter(t=>t.status==='Completed').length;return `<div class="barrow"><span>${esc(c)}</span><div class="bars"><i style="width:${n.length?d/n.length*100:0}%"></i></div><b>${d}/${n.length}</b></div>`}).join('')||'<p class="muted">No tasks.</p>'}</div>`}).join('')}</div><div class="card section"><h3>Recent activity by day</h3>${Array.from({length:7},(_,i)=>addDays(i-6)).map(d=>{let n=visibleActivities().filter(a=>a.date===d).length;return `<div class="barrow"><span>${d}</span><div class="bars"><i style="width:${Math.min(n*15,100)}%"></i></div><b>${n}</b></div>`}).join('')}</div>`}
function renderDeliverables(){let ts=visibleTasks().filter(t=>safeURL(t.url));return `<div class="card"><div class="flex between"><h3>Submitted task deliverables (${ts.length})</h3><button class="btn secondary small" onclick="exportCSV('deliverables')">Export CSV</button></div><div class="scroll"><table><tr><th>Task</th><th>Employee</th><th>Status</th><th>URL</th></tr>${ts.map(t=>`<tr><td>${esc(t.name)} ${t.sample?label('SAMPLE'):''}</td><td>${esc(t.owner)}</td><td>${label(t.status)}</td><td>${link(t.url)}</td></tr>`).join('')}</table></div></div>`}
function renderSettings(){return `<div class="card"><h3>Data and backups</h3><div class="flex"><button class="btn" onclick="exportJSON()">Download JSON backup</button><label class="btn secondary">Import JSON <input type="file" accept="application/json" onchange="importJSON(this)" style="display:none"></label><button class="btn danger" onclick="clearSamples()">Remove sample records</button></div></div>${admin()?`<div class="card section"><h3>SEO categories</h3><div class="flex"><input id="catName" placeholder="New category"><button class="btn" onclick="addCategory()">Add category</button></div><div class="section">${db.categories.map((c,i)=>`<div class="flex" style="margin:8px 0"><span>${esc(c)}</span><button class="btn secondary small" onclick="renameCategory(${i})">Rename</button><button class="btn danger small" onclick="removeCategory(${i})">Remove</button></div>`).join('')}</div></div>`:''}<div class="card section"><h3>Account</h3><button class="btn secondary" onclick="SB.auth.signOut().then(()=>location.reload())">Sign out</button></div>`}
function openTask(id,due){editing=id||null;let t=id?db.tasks.find(x=>x.id===id):null;if(t&&!admin()&&t.owner!==role())return alert('You can edit only your own tasks in this local profile view.');let f=document.getElementById('taskForm');f.reset();document.getElementById('taskTitle').textContent=t?'Edit Task':'Create Task';document.getElementById('taskOwner').innerHTML=(admin()?USERS:[role()]).map(x=>`<option>${esc(x)}</option>`).join('');document.getElementById('taskCategory').innerHTML=db.categories.map(x=>`<option>${esc(x)}</option>`).join('');if(t)Object.keys(t).forEach(k=>{if(f.elements[k]&&typeof t[k]!=='object')f.elements[k].value=t[k]??''});else{f.elements.owner.value=role();f.elements.assigned.value=today();f.elements.start.value=today();f.elements.due.value=due||addDays(7)}document.getElementById('feedbackField').classList.toggle('hidden',!admin());document.getElementById('qualityField').classList.toggle('hidden',!admin());document.getElementById('taskOwner').disabled=!admin();taskDialog.showModal()}
function editTask(id){openTask(id)}document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f).entries());if(!admin())o.owner=role();o.progress=Math.max(0,Math.min(100,Number(o.progress)||0));if(!admin()){delete o.feedback;delete o.quality;if(o.status==='Completed')o.status='Under Review'}if(o.status==='Completed'&&!admin())o.status='Under Review';if(o.status==='Under Review')o.progress=100;if(o.status==='Completed'){o.progress=100;o.completed=o.completed||today()}else o.completed='';if(editing){let t=db.tasks.find(x=>x.id===editing);if(!t)return;Object.assign(t,o);t.history=t.history||[];t.history.push({at:new Date().toISOString(),by:role(),action:'Updated',note:'Task edited'})}else db.tasks.push({...o,id:uid(),sample:false,history:[{at:new Date().toISOString(),by:role(),action:'Created',note:''}]});save();taskDialog.close();render()};
function submitReview(id){let t=db.tasks.find(x=>x.id===id);if(!t||(!admin()&&t.owner!==role()))return;t.status='Under Review';t.progress=100;t.completed='';t.history=t.history||[];t.history.push({at:new Date().toISOString(),by:role(),action:'Submitted for review',note:''});save();render()}
function reviewTask(id,action){if(!admin())return alert('Manager profile required.');let t=db.tasks.find(x=>x.id===id);if(!t)return;let note=prompt(action==='approve'?'Approval feedback (optional):':'Enter feedback for the employee:');if(note===null)return;if(action!=='approve'&&!note.trim())return alert('Feedback is required.');t.feedback=note;t.status=action==='approve'?'Completed':action==='revise'?'Revision Requested':'On Hold';t.completed=action==='approve'?today():'';t.progress=action==='approve'?100:t.progress;t.history=t.history||[];t.history.push({at:new Date().toISOString(),by:role(),action:action==='approve'?'Approved':action==='revise'?'Revisions requested':'Rejected',note});save();render()}
function deleteTask(id){let t=db.tasks.find(x=>x.id===id);if(!t||(!admin()&&t.owner!==role()))return;if(confirm('Delete this task permanently?')){db.tasks=db.tasks.filter(x=>x.id!==id);save();render()}}
function openActivity(){let f=document.getElementById('activityForm');f.reset();document.getElementById('activityOwner').innerHTML=(admin()?USERS:[role()]).map(x=>`<option>${esc(x)}</option>`).join('');f.elements.owner.value=role();f.elements.date.value=today();document.getElementById('linkedTask').innerHTML='<option value="">Independent activity</option>'+visibleTasks().map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('');document.getElementById('activityOwner').disabled=!admin();activityDialog.showModal()};document.getElementById('activityForm').onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target).entries());if(!admin())o.owner=role();db.activities.push({...o,id:uid(),sample:false});save();activityDialog.close();render()};function deleteActivity(id){let a=db.activities.find(x=>x.id===id);if(!a||(!admin()&&a.owner!==role()))return;if(confirm('Delete this activity?')){db.activities=db.activities.filter(x=>x.id!==id);save();render()}}function submitDaily(){let d=document.getElementById('reportDate').value,p=role();if(admin())return alert('Switch to an employee profile to submit a daily report.');if(!visibleActivities().some(a=>a.date===d))return alert('Log an activity for this date first.');if(db.reports.some(r=>r.owner===p&&r.date===d))return alert('Report already submitted for this date.');db.reports.push({id:uid(),owner:p,date:d,submittedAt:new Date().toISOString()});save();render();alert('Daily report saved.')}
function exportCSV(type){let rows=type==='tasks'?selected():type==='activities'?visibleActivities():visibleTasks().filter(t=>t.url);if(!rows.length)return alert('Nothing to export.');let cols=type==='activities'?['date','owner','description','task','blocker','url','sample']:['name','owner','category','priority','assigned','start','due','completed','status','progress','url','description','blocker','feedback','quality','sample'];let csv=[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');download('seo-'+type+'.csv',csv,'text/csv;charset=utf-8')};function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportJSON(){download('seo-dashboard-backup.json',JSON.stringify(db,null,2),'application/json')};async function importJSON(input){let file=input.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.tasks)||!Array.isArray(data.activities)||!Array.isArray(data.categories)||!Array.isArray(data.reports))throw Error('Invalid backup structure');if(!confirm('Replace ALL shared team data with this backup? Everyone will see the change.'))return;db=data;save();render()}catch(e){alert('Import failed: '+e.message)}input.value=''}function clearSamples(){if(!confirm('Remove all sample tasks and activities?'))return;db.tasks=db.tasks.filter(x=>!x.sample);db.activities=db.activities.filter(x=>!x.sample);save();render()}function addCategory(){let v=document.getElementById('catName').value.trim();if(v&&!db.categories.includes(v)){db.categories.push(v);save();render()}}function renameCategory(i){if(!admin())return;let old=db.categories[i],v=prompt('New category name:',old);if(!v||!v.trim()||db.categories.includes(v.trim()))return;db.categories[i]=v.trim();db.tasks.forEach(t=>{if(t.category===old)t.category=v.trim()});save();render()}function removeCategory(i){if(!admin())return;let c=db.categories[i];if(db.tasks.some(t=>t.category===c))return alert('Category is in use. Reassign tasks before removing it.');if(confirm('Remove category '+c+'?')){db.categories.splice(i,1);save();render()}}function resetFilters(){filters={search:'',owner:'all',status:'all',category:'all',priority:'all',from:'',to:''};render()}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>{page=n.dataset.page;render()});document.getElementById('profile').onchange=()=>{filters.owner='all';lastPage=null;render()};document.getElementById('newTask').onclick=()=>openTask();document.getElementById('content').addEventListener('input',e=>{let map={fSearch:'search',fOwner:'owner',fStatus:'status',fCategory:'category',fPriority:'priority',fFrom:'from',fTo:'to'};if(map[e.target.id]){let id=e.target.id,selStart=e.target.selectionStart;filters[map[id]]=e.target.value;render();if(id==='fSearch'){let x=document.getElementById(id);x.focus();x.setSelectionRange(selStart,selStart)}}});document.getElementById('content').addEventListener('change',e=>{let map={fOwner:'owner',fStatus:'status',fCategory:'category',fPriority:'priority',fFrom:'from',fTo:'to'};if(map[e.target.id]){filters[map[e.target.id]]=e.target.value;render()}});const themeBtn=document.getElementById('themeToggle'),isDark=()=>document.documentElement.dataset.theme==='dark',paintTheme=()=>{themeBtn.textContent=isDark()?'☀':'☾';themeBtn.title=isDark()?'Light mode':'Dark mode'};paintTheme();
themeBtn.onclick=()=>{document.documentElement.classList.add('theming');setTimeout(()=>document.documentElement.classList.remove('theming'),450);document.documentElement.dataset.theme=isDark()?'light':'dark';try{localStorage.setItem('seo-theme',document.documentElement.dataset.theme)}catch{}paintTheme()};
document.getElementById('navToggle').onclick=()=>{let c=document.documentElement.classList.toggle('navcollapsed');try{localStorage.setItem('seo-nav',c?'collapsed':'open')}catch{}setTimeout(moveInd,280)};
document.querySelectorAll('.nav').forEach(n=>n.title=n.textContent.trim());
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(d.id==='loginDialog'||e.target!==d)return;let r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}));
const RM=matchMedia('(prefers-reduced-motion: reduce)');let calDir=0;const seen={};
function countUp(root){if(RM.matches)return;root.querySelectorAll('.kpi strong').forEach(el=>{let m=el.textContent.trim().match(/^([$]?)([0-9,]+(?:[.][0-9]+)?)(.*)$/);if(!m)return;let pre=m[1],numS=m[2],suf=m[3],target=parseFloat(numS.replace(/,/g,'')),dec=(numS.split('.')[1]||'').length,t0=performance.now();if(!target)return;const step=now=>{let p=Math.min(1,(now-t0)/750),e=1-Math.pow(1-p,3);el.textContent=pre+(target*e).toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;if(p<1)requestAnimationFrame(step)};el.textContent=pre+'0'+suf;requestAnimationFrame(step)})}
function flashChanges(pc){document.querySelectorAll('#content tr[data-id]').forEach(r=>{let id=r.dataset.id,sig=r.textContent;if(!pc&&!RM.matches&&seen[id]!==sig)r.classList.add('flash');seen[id]=sig})}
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent='✓ '+m;t.classList.remove('show');void t.offsetWidth;t.classList.add('show')}
const navInd=document.createElement('span');navInd.className='navind';document.querySelector('.sidebar').appendChild(navInd);document.querySelector('.sidebar').classList.add('hasind');
function moveInd(){let a=document.querySelector('.nav.active');if(!a){navInd.style.opacity=0;return}navInd.style.opacity=1;navInd.style.transform='translateY('+a.offsetTop+'px)';navInd.style.height=a.offsetHeight+'px';navInd.style.left=a.offsetLeft+'px';navInd.style.width=a.offsetWidth+'px'}
addEventListener('resize',moveInd);document.querySelector('.shell').addEventListener('transitionend',e=>{if(e.target.classList.contains('shell'))moveInd()});moveInd();
start();
</script></body></html>
